version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: contrato-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-contrato_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-contrato_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contrato_user} -d ${DB_NAME:-contrato_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contrato-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contrato-ai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-contrato_user}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-contrato_ai}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3001
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contrato-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001/api}
    container_name: contrato-ai-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - contrato-network

volumes:
  postgres_data:

networks:
  contrato-network:
    driver: bridge
